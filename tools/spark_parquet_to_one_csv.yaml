apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: parquet-to-one-csv
  namespace: hugedata
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster

  sparkVersion: "3.5.1"
  image: "gnuhhung317/spark-realtime-app"
  imagePullPolicy: IfNotPresent

  mainApplicationFile: local:///opt/spark/work-dir/hdfs_parquet_dir_to_one_csv_spark.py
  arguments:
    - --input
    - hdfs:///traffic_data/traffic_stream
    - --tmp
    - hdfs:///traffic_data/_tmp_csv_out
    - --final
    - hdfs:///traffic_data/csv/traffic_all.csv

  restartPolicy:
    type: Never

  volumes:
    - name: app-script
      configMap:
        name: parquet-to-one-csv-script

  driver:
    cores: 1
    memory: "1g"
    serviceAccount: default
    volumeMounts:
      - name: app-script
        mountPath: /opt/spark/work-dir

  executor:
    instances: 2
    cores: 1
    memory: "1g"
    volumeMounts:
      - name: app-script
        mountPath: /opt/spark/work-dir
