apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-streaming-deployment
  namespace: hugedata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-streaming
  template:
    metadata:
      labels:
        app: spark-streaming
    spec:
      serviceAccountName: spark
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ['sh', '-c', 'mkdir -p /ivy2 && chmod -R 777 /ivy2']
        volumeMounts:
        - name: ivy-cache
          mountPath: /ivy2
      containers:
      - name: spark-streaming
        image: spark-streaming:dev
        command: ["python", "/app/spark_stream.py"]
        envFrom:
        - secretRef:
            name: minio-credentials
        env:
        - name: MINIO_ENDPOINT
          value: "minio.hugedata.svc.cluster.local:9000"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: AWS_ACCESS_KEY_ID
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: "http://minio.hugedata.svc.cluster.local:9000"
        - name: AWS_S3_PATH_STYLE_ACCESS
          value: "true"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data # Path này có thể dùng để ghi dữ liệu tạm
        - name: ivy-cache
          mountPath: /ivy2
      volumes:
      - name: data-volume
        # SỬA LỖI NHỎ: Sử dụng PVC bạn đã định nghĩa
        persistentVolumeClaim:
          claimName: spark-data-pvc
      - name: ivy-cache
        persistentVolumeClaim:
          claimName: spark-ivy-pvc
---
# ====== CÁC TÀI NGUYÊN KHÁC (GIỮ NGUYÊN) ======
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-data-pvc
  namespace: hugedata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-ivy-pvc
  namespace: hugedata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: hugedata
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: hugedata
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-rolebinding
  namespace: hugedata
subjects:
- kind: ServiceAccount
  name: spark
  namespace: hugedata
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
